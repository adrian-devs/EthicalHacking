# /etc/nginx/sites-available/music-manager  (reemplaza example.com por tu dominio)
# Certificado: sudo certbot --nginx -d example.com
limit_req_zone $binary_remote_addr zone=mm_login:10m rate=5r/m;

server {
    listen 80;
    server_name example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;   # nginx >= 1.25.1: puedes usar 'listen 443 ssl;' + 'http2 on;'
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    server_tokens off;          # no anunciar la versión de nginx
    client_max_body_size 16k;   # coincide con MAX_CONTENT_LENGTH de la app

    location = /login {
        limit_req zone=mm_login burst=5 nodelay;   # capa extra contra fuerza bruta
        include /etc/nginx/snippets/music-manager-proxy.conf;
    }
    location / {
        include /etc/nginx/snippets/music-manager-proxy.conf;
    }
}
