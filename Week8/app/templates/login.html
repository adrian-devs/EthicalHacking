{% extends "base.html" %}
{% block title %}Iniciar sesión · Music Manager{% endblock %}

{% block content %}
<section class="form-panel narrow">
  <h1>Iniciar sesión</h1>
  <form method="post" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field">
      <label for="username">Usuario</label>
      <input id="username" name="username" type="text" maxlength="40" required autocomplete="username" autofocus value="{{ form.username }}">
    </div>
    <div class="field">
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" maxlength="128" required autocomplete="current-password">
    </div>
    <div class="form-actions">
      <button class="btn btn-primary" type="submit">Entrar</button>
      {% if registration %}<a class="btn btn-link" href="{{ url_for('register') }}">Crear cuenta</a>{% endif %}
    </div>
  </form>
</section>
{% endblock %}
