{% extends "base.html" %}
{% block title %}Crear cuenta · Music Manager{% endblock %}

{% block content %}
<section class="form-panel narrow">
  <h1>Crear cuenta</h1>
  <form method="post" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    {% if invite_required %}
    <div class="field">
      <label for="invite">Código de invitación</label>
      <input id="invite" name="invite" type="password" maxlength="128" required autocomplete="off">
    </div>
    {% endif %}
    <div class="field">
      <label for="username">Usuario</label>
      <input id="username" name="username" type="text" minlength="3" maxlength="40" required autocomplete="username" autofocus value="{{ form.username }}">
    </div>
    <div class="field">
      <label for="password">Contraseña <span class="optional">(mínimo {{ pw_min }} caracteres)</span></label>
      <input id="password" name="password" type="password" minlength="{{ pw_min }}" maxlength="128" required autocomplete="new-password">
    </div>
    <div class="field">
      <label for="confirm">Repite la contraseña</label>
      <input id="confirm" name="confirm" type="password" maxlength="128" required autocomplete="new-password">
    </div>
    <div class="form-actions">
      <button class="btn btn-primary" type="submit">Crear cuenta</button>
      <a class="btn btn-link" href="{{ url_for('login') }}">Ya tengo cuenta</a>
    </div>
  </form>
</section>
{% endblock %}
