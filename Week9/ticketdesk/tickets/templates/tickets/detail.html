{% extends "tickets/base.html" %}
{% block content %}
<h2>Ticket #{{ ticket.pk }} &mdash; {{ ticket.title }}</h2>
<p>Owner: {{ ticket.owner.username }} &middot; Severity: <span class="sev-{{ ticket.severity }}">{{ ticket.get_severity_display }}</span></p>
<div class="card">{{ ticket.description|linebreaksbr }}</div>
<!--Nuevo cambio-->
<form method="post" action="/tickets/{{ ticket.pk }}/delete/">
  {% csrf_token %}
  <button type="submit" style="background:none;border:none;color:#ff6b6b;cursor:pointer">Delete this ticket</button>
</form>


{% endblock %}
